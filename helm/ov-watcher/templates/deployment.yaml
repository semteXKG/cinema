apiVersion: apps/v1
kind: Deployment
metadata:
  name: ov-watcher
  labels:
    app: ov-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ov-watcher
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ov-watcher
        # Opt out of Datadog APM init-container injection. Must be a LABEL:
        # the datadog.webhook.lib.injection webhook's objectSelector matches
        # labels (annotation.datadoghq.com/enabled is ignored). ~2.5 min of
        # per-language lib init containers made the 120s rollout timeout fail.
        admission.datadoghq.com/enabled: "false"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ov-watcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ov-watcher-config
            - secretRef:
                name: ov-watcher-secret
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ov-watcher-data
