image:
  repository: ghcr.io/semtexkg/cinema
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

persistence:
  create: true

config:
  checkIntervalHours: "3"
  sources: "cineplexx,megaplex"
  smtpHost: ""
  smtpPort: "587"
  smtpUsername: ""
  smtpFrom: ""
  # Drop failed notification batches after this many hours
  # (runtime env NOTIFICATION_MAX_RETRY_AGE_HOURS, default 168).
  # notificationMaxRetryAgeHours: "168"

secrets:
  telegramBotToken: ""
  # Öffentlicher Kanal: Chat-ID ist der @-Name (Bot muss Kanal-Admin sein).
  telegramChatId: "@ov_linz"
  # Telegram webhook secret for handle verification (runtime env
  # TELEGRAM_WEBHOOK_SECRET); if set, the bot registers its webhook on startup.
  # telegramWebhookSecret: ""
  # Optional override for notification sender address (runtime env
  # NOTIFICATION_EMAIL_FROM); defaults to showings@<host>.
  # notificationEmailFrom: "showings@cinema.k-labs.app"
  databaseUrl: ""     # only used when postgres.create=false
  googleClientId: ""
  googleClientSecret: ""
  githubClientId: ""
  githubClientSecret: ""
  smtpPassword: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  host: cinema.k-labs.app

postgres:
  create: true
  password: ""        # set once via --set, must stay stable afterwards
  storage: 1Gi
