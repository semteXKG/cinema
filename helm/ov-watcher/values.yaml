image:
  repository: ghcr.io/semtexkg/cinema
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

persistence:
  create: true

config:
  checkIntervalHours: "3"
  sources: "cineplexx,megaplex"
  smtpHost: ""
  smtpPort: "587"
  smtpUsername: ""
  smtpFrom: ""

secrets:
  telegramBotToken: ""
  # Öffentlicher Kanal: Chat-ID ist der @-Name (Bot muss Kanal-Admin sein).
  telegramChatId: "@ov_linz"
  databaseUrl: ""     # only used when postgres.create=false
  googleClientId: ""
  googleClientSecret: ""
  githubClientId: ""
  githubClientSecret: ""
  smtpPassword: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  host: cinema.k-labs.app

postgres:
  create: true
  password: ""        # set once via --set, must stay stable afterwards
  storage: 1Gi
