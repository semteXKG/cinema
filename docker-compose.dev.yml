services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ov
      POSTGRES_PASSWORD: ov
      POSTGRES_DB: ov
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ov"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    working_dir: /build
    command: cargo watch -x run
    volumes:
      - ./backend:/build
      - cargo-target:/build/target
      - ./data:/data
    environment:
      DATABASE_URL: postgres://ov:ov@db:5432/ov
      PORT: "8080"
      DATA_DIR: /data
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: {}
  cargo-target: {}
