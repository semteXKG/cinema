name: Telegram Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message to @ov_linz
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          MSG=$(cat <<'EOF'
          🎬 <b>Neue OV-Vorstellungen in Linz</b> (Demo)

          <b>Cineplexx Linz</b>
          <b>The Odyssey (OV)</b>
          • <a href="https://cineplexx.at/film/die-odyssee">Saal 6 · Mo 20.07., 19:00</a>
          • <a href="https://cineplexx.at/film/die-odyssee">Saal 3 · Di 21.07., 20:15</a>
          <b>F1 (OmU)</b>
          • <a href="https://cineplexx.at/film/f1">Saal 2 · Di 21.07., 20:15</a>

          <b>Megaplex PlusCity</b>
          <b>Die Odyssee (OV - IMAX 2D)</b>
          • <a href="https://www.megaplex.at/ticket/57419/539128">Mo 20.07., 19:45</a>
          EOF
          )
          curl -sS -f "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id=@ov_linz \
            --data-urlencode parse_mode=HTML \
            --data-urlencode 'link_preview_options={"is_disabled":true}' \
            --data-urlencode "text=${MSG}"
