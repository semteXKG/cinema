name: Build and Deploy

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: semtexkg/cinema

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ov
          POSTGRES_PASSWORD: ov
          POSTGRES_DB: ov
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ov"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ov:ov@localhost:5432/ov
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Backend tests
        working-directory: backend
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: build
    runs-on: arc-runner-cinema
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Set image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy with Helm
        env:
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$APPLE_PRIVATE_KEY" > /tmp/apple-key.pem
          helm upgrade --install ov-watcher ./helm/ov-watcher \
            --namespace default \
            --set image.tag=${{ steps.tag.outputs.sha }} \
            --set secrets.telegramBotToken="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            --set secrets.googleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --set secrets.googleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --set secrets.appleClientId="${{ secrets.APPLE_CLIENT_ID }}" \
            --set secrets.appleTeamId="${{ secrets.APPLE_TEAM_ID }}" \
            --set secrets.appleKeyId="${{ secrets.APPLE_KEY_ID }}" \
            --set-file secrets.applePrivateKey=/tmp/apple-key.pem \
            --set secrets.githubClientId="${{ secrets.GITHUB_CLIENT_ID }}" \
            --set secrets.githubClientSecret="${{ secrets.GITHUB_CLIENT_SECRET }}" \
            --set secrets.smtpPassword="${{ secrets.SMTP_PASSWORD }}" \
            --set config.smtpHost="${{ secrets.SMTP_HOST }}" \
            --set config.smtpPort="${{ secrets.SMTP_PORT }}" \
            --set config.smtpUsername="${{ secrets.SMTP_USERNAME }}" \
            --set config.smtpFrom="${{ secrets.SMTP_FROM }}" \
            --set postgres.password="${{ secrets.POSTGRES_PASSWORD }}"

      - name: Verify rollout
        run: kubectl rollout status deployment/ov-watcher -n default --timeout=120s
