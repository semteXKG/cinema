services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ov
      POSTGRES_PASSWORD: ov
      POSTGRES_DB: ov
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ov"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata: {}
